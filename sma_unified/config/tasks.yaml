  Analizar_Consistencia:
    perfil: normativo
    descripcion: 'Auditoría semántica con pgvector sobre corpus de leyes vigentes de Bolivia. Detecta antinomias, derogaciones
      tácitas y redundancias. Presenta cuadro comparativo con sugerencia de redacción.

      '
    description: 'Auditoría semántica con pgvector sobre corpus de leyes vigentes de Bolivia. Detecta antinomias, derogaciones
      tácitas y redundancias. Presenta cuadro comparativo con sugerencia de redacción.

      '
    agente: Consistencia_Normativa
    agent: Consistencia_Normativa
    depends_on:
    - Clasificar_Documento
    framework_diseno: RTF
    tecnicas_prompt:
    - Least-to-most (por artículo)
    - Chain of Thought
    - ReAct (pgvector + comparación semántica)
    - Generated knowledge (corpus normativo boliviano)
    - Self-consistency (doble búsqueda vectorial)
    - Chain of Verification (3 preguntas)
    - Analogical prompting (caso análogo de derogación tácita)
    - Structured output (JSON)
    - Negative prompting (5 prohibiciones)
    contexto_boliviano:
      corpus: PostgreSQL Neon pgvector — leyes, códigos y decretos vigentes
      codigos:
      - Código Penal (Ley 1768)
      - Código Civil (D.L. 12760)
      - Código de Procedimiento Penal (Ley 1970)
      - Código de Comercio (D.L. 14379)
      - Ley General del Trabajo (1942)
      leyes_organicas:
      - Ley 1178 SAFCO
      - Ley 031 Autonomías
      - Ley 300 Madre Tierra
      - Ley 070 Educación
      - Ley 348 Violencia contra la Mujer
      principios:
      - jerarquía
      - temporalidad
      - especialidad
      - no retroactividad (Art. 123 CPE)
    prompt_operativo: "[ROL]\nEspecialista en técnica legislativa y coherencia del ordenamiento jurídico\nboliviano. Conoces\
      \ jerarquía, temporalidad, especialidad y no retroactividad\n(Art. 123 CPE).\n\n[ACCIÓN — LEAST-TO-MOST]\nPara cada\
      \ artículo:\n  Paso 1. Genera embeddings 2048d del articulado propuesto.\n  Paso 2 (ReAct). Busca en pgvector los 5\
      \ artículos vigentes más similares\n          (similitud ≥ 0.70).\n  Paso 3 (Generated Knowledge). Recupera: norma,\
      \ artículo, jerarquía,\n          fecha de publicación en Gaceta.\n  Paso 4 (CoT). Clasifica relación: COLISION | DEROGACION_TACITA\
      \ |\n          REDUNDANCIA | COMPLEMENTARIA.\n  Paso 5. Propone redacción alternativa que evite la antinomia.\n\n[SELF-CONSISTENCY]\n\
      Ejecuta la búsqueda vectorial 2 veces (con y sin sinónimos jurídicos\nbolivianos). Si top-5 difieren > 40% → nivel_riesgo_global='MEDIO'.\n\
      \n[CHAIN OF VERIFICATION — 3 preguntas]\n  P1. ¿La norma vigente citada existe en el corpus?\n  P2. ¿La fecha de la\
      \ norma vigente es ANTERIOR al proyecto?\n  P3. ¿Existe especialidad o solo coincidencia temática?\n\n[ANALOGICAL]\n\
      Recupera 1 caso histórico análogo (ej. derogación tácita entre Ley 1178 y\nLey 031) y úsalo como plantilla.\n\n[FORMATO]\n\
      JSON estricto según contrato, es-BO.\n\n[NEGATIVE PROMPTING — 5 prohibiciones]\n- PROHIBIDO citar leyes fuera del corpus\
      \ recuperado por la tool.\n- PROHIBIDO inventar números de ley, artículos o fechas.\n- PROHIBIDO confundir COLISION\
      \ con REDUNDANCIA.\n- PROHIBIDO omitir 'sugerencia_redaccion' en COLISION.\n- PROHIBIDO clasificar DEROGACION_TACITA\
      \ si la norma vigente es POSTERIOR.\n"
    expected_output: "{\n  \"nivel_riesgo_global\": \"BAJO | MEDIO | ALTO | CRITICO\",\n  \"hallazgos\": [\n    {\n      \"\
      articulo_proyecto\": \"Art. X\",\n      \"norma_vigente\": \"Ley N° XXXX\",\n      \"articulo_vigente\": \"Art. Y\"\
      ,\n      \"tipo_relacion\": \"COLISION | DEROGACION_TACITA | REDUNDANCIA | COMPLEMENTARIA\",\n      \"similitud_semantica\"\
      : 0.85,\n      \"justificacion\": \"string\",\n      \"sugerencia_redaccion\": \"string\"\n    }\n  ],\n  \"resumen_consistencia\"\
      : \"string\"\n}\n"
    criterios_aceptacion:
    - Toda norma citada proviene del corpus (metadatos verificables).
    - Similitud semántica justificada con valor numérico.
    - Sugerencia de redacción en hallazgos COLISION.
    - Fecha de norma vigente anterior al proyecto para DEROGACION_TACITA.
    politica_degradacion:
      pgvector_no_disponible: nivel_riesgo_global='MEDIO', resumen con 'tool no disponible', no inventar.
      sin_antinomias: nivel_riesgo_global='BAJO', hallazgos=[], resumen='Sin antinomias detectadas'.
      similitud_baja: Descartar hallazgos con similitud < 0.70.
    herramientas:
    - pgvector_search
    - normativa_metadata_lookup
