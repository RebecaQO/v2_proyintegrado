    perfil: conversacional
    descripcion: >
      Análisis técnico pericial y fáctico: infraestructura existente, estándares
      internacionales (ISO, OIT, OMS, Escazú), matriz de riesgos y viabilidad en
      el contexto geográfico boliviano.
    description: >
