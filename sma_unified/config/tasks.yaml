      \ texto exacto de artículos.\n3. Evalúa: ¿hay derogación expresa, modificación de artículos, duplicación?\n4. Concluye:\
      \ ARMONICO | CONFLICTO_RESOLUBLE | CONFLICTO_IRRECONCILIABLE.\n \n[CoVe] ¿La contradicción es con texto expreso vigente\
      \ o solo interpretativa?\n¿La derogación es nominal (Art. X queda derogado) o tácita genérica?\n \nSalida: {\"indice_coherencia\"\
      :..., \"conflictos\":[{\"norma_vigente\":..., \"articulo_conflicto\":..., \"tipo\":..., \"severidad\":...}], \"tabla_vigencia\"\
      :[...]}"
