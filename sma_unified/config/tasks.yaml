tarea_atencion_ciudadana:
  description: |
    Procesa la solicitud ciudadana:
    {texto_documento}
  expected_output: 'JSON: {"prioridad": "Alta/Media/Baja", "categoria": "...", "resumen": "..."}'
  agent: "Interaccion_Ciudadana"
  framework_diseno: "CARE"

tarea_verificacion_constitucional:
  description: |
    Audita cada artículo del proyecto contra todos los artículos CPE relacionados recibidos en {articulos_constitucion_info}.
    Devuelve para cada artículo del proyecto solo A_FAVOR o EN_CONTRA. Para cada candidato constitucional relacionado
    incluye clasificación binaria, citas literales, justificación técnica, comentario analítico y sugerencia legislativa.
    Si no se acredita colisión directa, emite A_FAVOR provisional con evidencia_suficiente=false, confianza baja y
    limitación explícita; nunca emitas NEUTRAL ni PENDIENTE_REVISION como clasificación.
    Articulado: {texto_documento}
  expected_output: 'JSON: {"evaluaciones_por_articulo":[{"articulo_proyecto":"Art. 1","clasificacion":"A_FAVOR|EN_CONTRA","justificacion_tecnica":"...","comentario_analitico":"...","sugerencia":"...","evidencia_suficiente":false,"articulos_relacionados":[]}],"limitaciones_revision":[]}'
  agent: "Verificador_Constitucional"
  framework_diseno: "CRAFT"

tarea_clasificacion_comision:
  description: >
    Analizar técnica y jurídicamente la iniciativa de ley para determinar con precisión vinculante
    la Comisión Principal (matriz encargada del dictamen de fondo) y la Comisión Coadyuvante (secundaria
    encargada del análisis concurrente, presupuestario o constitucional), valorando el núcleo material del proyecto,
    el impacto fiscal sobre el TGN y las competencias territoriales o sectoriales, conforme al Art. 156 de la CPE
    y al Reglamento General Camaral de la ALP.
  agent: "Presidencia_Comision"
  framework_diseno: "CARE"
  tecnicas_prompt:
    - "Role prompting (Clasificador Oficial de Comisiones ALP)"
    - "Chain of Thought (evaluación de competencias en 4 pasos)"
    - "Regla de Dos Comisiones (Comisión Principal + Comisión Coadyuvante)"
    - "Few-shot canónico (ejemplo con justificación jurídica)"
    - "Structured output (JSON estricto es-BO)"
    - "Negative prompting (5 restricciones terminantes)"
  contexto_boliviano:
    marco_normativo:
      - "Constitución Política del Estado 2009 (Art. 156)"
      - "Reglamento General de la Cámara de Diputados y de Senadores (Arts. 115 a 125)"
      - "Ley 1178 de Administración y Control Gubernamentales (SAFCO)"
    regla_distribucion_dos_comisiones: >
      1. Todo proyecto tiene una y solo una Comisión Principal según el objeto sustantivo de la ley.
      2. Si el proyecto involucra gasto, créditos, deuda o recursos del TGN -> Se asigna obligatoriamente
         como Comisión Coadyuvante a la Comisión de Planificación, Política Económica y Finanzas.
      3. Si el proyecto modifica códigos sustantivos, procesales, normas penales o estructura de órganos del Estado
         -> Se asigna como Comisión Coadyuvante a la Comisión de Constitución, Legislación y Sistema Electoral.
      4. Si involucra régimen autonómico o límites -> Comisión de Organización Territorial y Autonomías.
  prompt_operativo: |
    [ROL Y MISIÓN PARLAMENTARIA]
    Actúa como la Máxima Autoridad Técnica de Clasificación y Asignación de Comisiones de la Asamblea
    Legislativa Plurinacional de Bolivia (ALP). Tu deber es examinar el proyecto de ley y determinar sin ambigüedad
    las comisiones parlamentarias encargadas de su sustanciación legislativa.

    [TEXTO DEL PROYECTO DE LEY EVALUADO]
    <proyecto_ley>
    {texto_documento}
    </proyecto_ley>

    [CATÁLOGO OFICIAL DE COMISIONES ACTIVAS EN LA BASE DE DATOS]
    <comisiones_disponibles>
    {comisiones_info}
    </comisiones_disponibles>

    [MÉTODO DE EVALUACIÓN JURÍDICA — 4 PASOS OBLIGATORIOS]
      Paso 1. Identifica el NÚCLEO MATERIAL Y OBJETO SUSTANTIVO: ¿Qué relación jurídica o sector regula?
              Selecciona exactamente una COMISIÓN PRINCIPAL del catálogo de comisiones activas.
      Paso 2. Identifica IMPACTOS CONCURRENTES (Regla de Dos Comisiones):
              - Si compromete fondos públicos, partidas del TGN, exenciones o gasto público → Asigna como COMISIÓN COADYUVANTE a 'Comisión de Planificación, Política Económica y Finanzas'.
              - Si altera normas penales, códigos procesales o garantías constitucionales → Asigna como COMISIÓN COADYUVANTE a 'Comisión de Constitución, Legislación y Sistema Electoral'.
              - Si no existe conexidad material secundaria → Asigna 'NINGUNA' o la comisión sectorial afín.
      Paso 3. Califica la COMPLEJIDAD (Baja, Media, Alta), la PRIORIDAD (Normal, Alta, Urgente) y el PLAZO REGLAMENTARIO (15 a 30 días hábiles).
      Paso 4. Extrae de 4 a 6 PALABRAS CLAVE sustantivas y redacta un RESUMEN EJECUTIVO (2 a 4 líneas) junto con la FUNDAMENTACIÓN DE COMPETENCIA.

    [CONTRATO DE SALIDA — JSON ESTRICTO]
    Devuelve ÚNICAMENTE un objeto JSON con este esquema exacto, sin bloques de código markdown ni texto adicional:
    {
      "comision_principal": "Nombre exacto de la comisión principal seleccionada",
      "comision_coadyuvante": "Nombre exacto de la comisión coadyuvante o NINGUNA",
      "fundamentacion_competencia": "Explicación jurídica de 30-70 palabras justificando por qué ambas comisiones son competentes según la CPE y el Reglamento Camaral",
      "palabras_clave": ["Palabra1", "Palabra2", "Palabra3", "Palabra4"],
      "resumen": "Resumen técnico formal de 2-4 oraciones sobre el alcance de la propuesta",
      "complejidad": "Baja | Media | Alta",
      "prioridad": "Normal | Alta | Urgente",
      "plazo_dias": 20
    }

    [PROHIBICIONES ESTRICTAS]
    - NO asignes comisiones fuera del catálogo disponible suministrado.
    - NO omitas la Comisión de Planificación y Finanzas si el proyecto dispone creación de entidades con presupuesto público o partidas del TGN.
    - NO uses abreviaciones informales para los nombres de las comisiones.
    - NO devuelvas texto introductorio ni explicaciones fuera del JSON.
  expected_output: >
    JSON estricto con: comision_principal, comision_coadyuvante, fundamentacion_competencia, palabras_clave, resumen, complejidad, prioridad y plazo_dias.
  criterios_aceptacion:
    - "Comisión Principal pertenece exactamente al catálogo de comisiones activas de la ALP."
    - "Comisión Coadyuvante fundamentada correctamente ante impacto fiscal o constitucional."
    - "Plazo en días hábiles entre 15 y 30 días reglamentarios."
    - "Extracción válida de descriptores temáticos."
  politica_degradacion:
    comision_no_encontrada: "Asignar por defecto COMISION_DE_CONSTITUCION como principal y COMISION_DE_PLANIFICACION_Y_FINANZAS como coadyuvante."

