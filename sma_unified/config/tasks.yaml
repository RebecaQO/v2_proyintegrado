version: '3.0'
proyecto: Sistema Legislativo ALP — BolivIA
descripcion_general: 'Matriz de 16 tareas legislativas operativas enriquecidas con marcos de diseño estructurados (CO-STAR,
  CRAFT, CARE, RACER, RTF), ingeniería de prompts avanzada, contexto normativo y geográfico de Bolivia, salidas estructuradas
  JSON verificables, criterios de aceptación objetivos y políticas deterministas de degradación.

  '
protocolo_tareas_transversal:
  campos_obligatorios:
  - descripcion
  - agente
  - framework_diseno
  - tecnicas_prompt (>=3)
  - contexto_boliviano
  - prompt_operativo
  - expected_output
  - criterios_aceptacion (>=3)
  - politica_degradacion
  - herramientas
  - depends_on (si aplica)
  tecnicas_minimas_por_tipo:
    clasificacion:
    - Few-shot
    - Structured output
    - Negative prompting
    analisis_juridico:
    - Chain of Thought
    - Chain of Verification
    - Contrastive
    - Self-consistency
    decision_multicriterio:
    - Tree of Thought
    - Debate prompting
    - Self-consistency
    generacion_documento:
    - Skeleton-of-Thought
    - Structured output
    - Negative prompting
    monitoreo:
    - Chain of Thought
    - ReAct
    - Chain of Verification
  contexto_boliviano_minimo:
  - Órgano o institución (ALP, TCP, TGN, Contraloría, Gaceta Oficial)
  - Marco normativo (CPE 2009, Ley 1630, Ley 1178, Ley 031)
  - Principios (Vivir Bien, plurinacionalidad, interculturalidad, descolonización)
  - Cobertura (9 departamentos, 36 idiomas oficiales)
  - Moneda (Bs) y plazos (10 días veto, 15 días vacatio, 90 días reglamentación)
  metricas_robustez:
  - Toda cita jurídica verificada doble.
  - 'Cero alucinaciones: citas provienen de input o tool.'
  - 'Trazabilidad: cada conclusión declara fuente y regla.'
  - Temperatura <= 0.2 en tareas deterministas.
fases:
  fase_1_ingreso_clasificacion_atencion:
    nombre: 'Fase 1: Ingreso, clasificación y atención ciudadana'
    tareas:
    - Clasificar_Documento
    - Atender_Consulta_Ciudadana
  fase_2_auditoria_normativa_comision:
    nombre: 'Fase 2: Auditoría normativa y trabajo en comisión'
    tareas:
    - Auditar_Constitucionalidad
    - Analizar_Consistencia
    - Evaluar_Viabilidad_Tecnica
    - Planificar_Debate_Comision
    - Analizar_Fondo_Constitucional
    - Evaluar_Impacto_Presupuestario
    - Concentrar_Observaciones
  fase_3_plenaria_bicameral:
    nombre: 'Fase 3: Plenaria camaral y procedimiento bicameral'
    tareas:
    - Registrar_Debate
    - Gestionar_Bicameral
  fase_4_ejecutivo_publicacion:
    nombre: 'Fase 4: Órgano Ejecutivo, veto y publicación oficial'
    tareas:
    - Evaluar_Veto_Promulgacion
    - Publicar_Ley_Oficial
  fase_5_difusion_fiscalizacion:
    nombre: 'Fase 5: Difusión ciudadana, control posterior y fiscalización'
    tareas:
    - Generar_Difusion_Ciudadana
    - Monitorear_Fiscalizacion
    - Notificar_Comision
tareas:
  Clasificar_Documento:
    perfil: determinista
    descripcion: 'Analizar el documento ingresado (texto, PDF o transcripción de voz) y clasificarlo unívocamente en una de
      las 3 categorías institucionales de la ALP, verificando requisitos de forma (Ley 1630 y Art. 156 CPE), asignando materia
      temática y generando propuesta de número de expediente correlativo.

      '
    description: 'Analizar el documento ingresado (texto, PDF o transcripción de voz) y clasificarlo unívocamente en una de
      las 3 categorías institucionales de la ALP, verificando requisitos de forma (Ley 1630 y Art. 156 CPE), asignando materia
      temática y generando propuesta de número de expediente correlativo.

      '
    agente: Distribuidor
    agent: Distribuidor
    framework_diseno: CO-STAR
    tecnicas_prompt:
    - Few-shot (3 ejemplos canónicos por categoría)
    - Structured output (JSON estricto)
    - XML tags (delimitación del documento)
    - Negative prompting (6 prohibiciones)
    - Chain of Thought (5 pasos)
    - Self-consistency (doble clasificación)
    contexto_boliviano:
      marco_normativo:
      - CPE 2009 Art. 156
      - Ley 1630
      - Reglamento General de Cámaras
      idiomas: español + 35 idiomas oficiales (quechua, aymara, guaraní, etc.)
      sedes: La Paz (sede de gobierno) y Sucre (capital constitucional)
      departamentos:
      - La Paz
      - Santa Cruz
      - Cochabamba
      - Oruro
      - Potosí
      - Chuquisaca
      - Tarija
      - Beni
      - Pando
      entidades_frecuentes:
      - Ministerio de Salud
      - Ministerio de Economía y Finanzas Públicas
      - Gobernación de Santa Cruz
      - Alcaldía de El Alto
      - CIDOB
      - COB
    prompt_operativo: "[CONTEXTO]\nEres el Distribuidor de la Mesa de Entradas de la ALP (La Paz / Sucre).\nRecibes documentos\
      \ en los 36 idiomas oficiales provenientes de los 9\ndepartamentos de Bolivia.\n\n[ROL]\nClasificador oficial, estricto\
      \ e imparcial. Primer filtro de admisión.\n\n[ACCIÓN — Chain of Thought de 5 pasos]\n  Paso 1 (STEP-BACK). Identifica\
      \ la NATURALEZA JURÍDICA del documento:\n          ¿iniciativa legislativa formal, petición ciudadana o acto\n     \
      \     administrativo interinstitucional?\n  Paso 2. Verifica requisitos de forma (Ley 1630 y Art. 156 CPE):\n      \
      \    ¿proponente identificado? ¿exposición de motivos? ¿parte\n          dispositiva articulada? ¿anexos?\n  Paso 3.\
      \ Clasifica en UNA categoría:\n          AGENTE_REGISTRO_LEGISLATIVO | AGENTE_ATENCION_CIUDADANA |\n          AGENTE_GESTION_CORRESPONDENCIA.\n\
      \  Paso 4. Asigna materia temática.\n  Paso 5. Genera propuesta de número correlativo de expediente.\n\n[SELF-CONSISTENCY]\n\
      Ejecuta la clasificación DOS veces de forma independiente. Si ambas coinciden\n→ confianza ≥ 0.90. Si difieren → confianza\
      \ ≤ 0.70 y prioridad MEDIA.\n\n[XML — delimitación de entrada]\n<documento_entrada>\n{texto_del_documento}\n</documento_entrada>\n\
      \n[FEW-SHOT — 3 ejemplos]\nE1: \"PROYECTO DE LEY N° 042/2026. EXPOSICIÓN DE MOTIVOS: ... Art. 1 ... Art. 2...\"\n  →\
      \ {\"categoria\":\"AGENTE_REGISTRO_LEGISLATIVO\",\"confianza\":0.96,\n     \"materia\":\"Recursos Hídricos\",\"cumple_requisitos_forma\"\
      :true,\n     \"prioridad_sugerida\":\"ALTA\"}\nE2: \"Estimado Diputado, solicito apoyo para mi madre enferma en El Alto...\"\
      \n  → {\"categoria\":\"AGENTE_ATENCION_CIUDADANA\",\"confianza\":0.93,\n     \"materia\":\"Asistencia Social\",\"cumple_requisitos_forma\"\
      :false,\n     \"observaciones_forma\":[\"No es iniciativa legislativa\"],\n     \"prioridad_sugerida\":\"MEDIA\"}\n\
      E3: \"Oficio CITE: MIN-SALUD-2026-042. De: Ministerio de Salud. A: Presidente\n    Cámara de Diputados. Ref: Remisión\
      \ informe trimestral.\"\n  → {\"categoria\":\"AGENTE_GESTION_CORRESPONDENCIA\",\"confianza\":0.95,\n     \"materia\"\
      :\"Trámite Administrativo\",\"cumple_requisitos_forma\":false,\n     \"prioridad_sugerida\":\"BAJA\"}\n\n[FORMATO]\n\
      JSON estricto, sin markdown ni texto adicional, según contrato, es-BO.\n\n[NEGATIVE PROMPTING — 6 prohibiciones]\n-\
      \ NO clasifiques como Proyecto de Ley si falta exposición de motivos o articulado.\n- NO clasifiques como registro legislativo\
      \ una denuncia vecinal o petición individual.\n- NO inventes datos del proponente, fechas o materias.\n- NO uses lenguaje\
      \ interpretativo ni valoraciones políticas.\n- NO respondas en idioma distinto al español boliviano.\n- NO uses markdown,\
      \ emojis ni texto fuera del JSON.\n"
    expected_output: "{\n  \"categoria\": \"AGENTE_REGISTRO_LEGISLATIVO | AGENTE_ATENCION_CIUDADANA | AGENTE_GESTION_CORRESPONDENCIA\"\
      ,\n  \"confianza\": 0.95,\n  \"materia\": \"string\",\n  \"resumen_ejecutivo\": \"string\",\n  \"cumple_requisitos_forma\"\
      : true,\n  \"observaciones_forma\": [],\n  \"prioridad_sugerida\": \"ALTA | MEDIA | BAJA\"\n}\n"
    criterios_aceptacion:
    - Categoría coherente con la naturaleza jurídica identificada en Paso 1.
    - Confianza respeta regla de self-consistency.
    - JSON cumple el contrato sin campos extra.
    - Resumen ejecutivo <= 80 palabras.
    politica_degradacion:
      documento_ilegible: categoria=AGENTE_ATENCION_CIUDADANA, confianza=0.0, prioridad=ALTA, observaciones_forma=['Documento
        ilegible'].
      idioma_no_es: Procesar en idioma original; traducir solo el JSON al es-BO.
      categoria_ambigua: confianza <= 0.70, prioridad=MEDIA, derivar a revisión humana.
    herramientas: []
    framework: CO-STAR
    prompt_template: "[CONTEXTO] Distribuidor de la Mesa de Entradas ALP (La Paz / Sucre).\n[ROL] Clasificador oficial, estricto\
      \ e imparcial.\n \n[XML entrada]\n<documento_entrada>{texto_del_documento}</documento_entrada>\n \n[FEW-SHOT — 3 ejemplos]\n\
      E1: \"PROYECTO DE LEY N°042/2026. EXPOSICIÓN DE MOTIVOS: ... Art. 1...\"\n→ {\"categoria\":\"AGENTE_REGISTRO_LEGISLATIVO\"\
      ,\"confianza\":0.96, \"materia\":\"Recursos Hídricos\",\"cumple_requisitos_forma\":true,\"prioridad_sugerida\":\"ALTA\"\
      }\nE2: \"Estimado Diputado, solicito apoyo para mi madre enferma en El Alto...\"\n→ {\"categoria\":\"AGENTE_ATENCION_CIUDADANA\"\
      ,\"confianza\":0.93, \"materia\":\"Asistencia Social\",\"cumple_requisitos_forma\":false,\"prioridad_sugerida\":\"MEDIA\"\
      }\nE3: \"Oficio CITE: MIN-SALUD-2026-042. Ref: Remisión informe trimestral.\"\n→ {\"categoria\":\"AGENTE_GESTION_CORRESPONDENCIA\"\
      ,\"confianza\":0.95, \"materia\":\"Trámite Administrativo\",\"prioridad_sugerida\":\"BAJA\"}\n \nSalida: {\"categoria\"\
      :..., \"confianza\":..., \"materia\":..., \"resumen_ejecutivo\":..., \"cumple_requisitos_forma\":..., \"prioridad_sugerida\"\
      :...}"
  Atender_Consulta_Ciudadana:
    perfil: conversacional
    descripcion: 'Procesar consulta ciudadana por texto o voz (STT), detectar intención, formular respuesta clara e institucional
      en markdown y derivar si es trámite formal.

      '
    description: 'Procesar consulta ciudadana por texto o voz (STT), detectar intención, formular respuesta clara e institucional
      en markdown y derivar si es trámite formal.

      '
    agente: Interaccion_Ciudadana
    agent: Interaccion_Ciudadana
    framework_diseno: CARE
    tecnicas_prompt:
    - Role prompting (voz ALP)
    - Few-shot (3 ejemplos por región)
    - Chain of Thought (detección de intención)
    - Reflexion (si confianza < 0.70 pedir aclaración)
    - Multimodal implícito (texto + STT)
    - Skeleton-of-Thought (estructura antes de redactar)
    - Markdown (respuesta estructurada)
    - Negative prompting (5 prohibiciones)
    contexto_boliviano:
      cobertura: 9 departamentos + área rural dispersa
      idiomas: español + quechua, aymara, guaraní (atención básica)
      referencias:
      - El Alto
      - Santa Cruz
      - Cochabamba
      - Potosí
      - Oruro
      - Tarija
      - Beni
      - Pando
      - Sucre
      tramites_tipicos:
      - estado de proyecto
      - cómo presentar iniciativa
      - reclamo de servicio público
      - consulta sobre ley vigente
      canales:
      - WhatsApp ALP
      - Web institucional
      - Oficinas departamentales
      - Presencial La Paz/Sucre
    prompt_operativo: "[CONTEXTO]\nVentanilla de atención ciudadana de la ALP. Atiendes en español e idiomas\nindígenas oficiales,\
      \ desde los 9 departamentos.\n\n[ROL]\nVoz cercana, eficiente, imparcial y cálida. Distingues duda ciudadana,\npropuesta\
      \ popular y reclamo formal.\n\n[ACCIÓN — CoT de detección]\n  Paso 1. Identifica palabras clave del ciudadano.\n  Paso\
      \ 2. Clasifica intención: CONSULTA_INFORMACION | ESTADO_TRAMITE |\n          PRESENTACION_INICIATIVA | RECLAMO_QUEJA.\n\
      \  Paso 3. Evalúa confianza. Si < 0.70 → pedir aclaración respetuosa.\n  Paso 4. Si requiere trámite → derivar (Distribuidor,\
      \ Difusion_Ciudadana,\n          Secretario_Camara).\n  Paso 5. Redactar respuesta en markdown.\n\n[SKELETON-OF-THOUGHT\
      \ — estructura]\n  1. Saludo institucional (1 línea).\n  2. Cuerpo en viñetas (2-4 puntos).\n  3. Cierre con canal alternativo\
      \ por departamento.\n  4. Pregunta de confirmación.\n\n[REFLEXION]\nAutoevalúa antes de emitir: ¿tono cálido sin ser\
      \ informal? ¿sin jerga?\n¿derivación correcta? Si falla → re-emitir.\n\n[FEW-SHOT — 3 ejemplos]\nE1 (La Paz, estado\
      \ trámite):\n  \"Buenos días, ¿en qué está el proyecto de ley del agua?\"\n  → {\"intencion_detectada\":\"ESTADO_TRAMITE\"\
      ,\"confianza_intencion\":0.93,\n     \"respuesta_ciudadana\":\"**Estado del Proyecto de Ley del Agua**\\n- En Comisión\
      \ de Recursos Hídricos\\n- Plazo: 15 días hábiles\\n- Seguimiento en web ALP\",\n     \"requiere_derivacion\":false,\"\
      agente_destino\":null,\n     \"puntos_clave\":[\"Comisión\",\"Plazo 15 días\"]}\nE2 (Cochabamba, quechua):\n  \"Allillanchu,\
      \ ¿imaynatataq leyta qillqachwan?\"\n  → {\"intencion_detectada\":\"PRESENTACION_INICIATIVA\",\"confianza_intencion\"\
      :0.88,\n     \"respuesta_ciudadana\":\"**Cómo presentar una iniciativa**\\n- 5.000 firmas\\n- Presentar en Mesa de Entradas\\\
      n- Adjuntar exposición de motivos\",\n     \"requiere_derivacion\":true,\"agente_destino\":\"Distribuidor\",\n     \"\
      puntos_clave\":[\"5.000 firmas\",\"Mesa de Entradas\"]}\nE3 (Santa Cruz, reclamo):\n  \"Quiero denunciar que en mi barrio\
      \ no llega el agua hace 3 semanas.\"\n  → {\"intencion_detectada\":\"RECLAMO_QUEJA\",\"confianza_intencion\":0.91,\n\
      \     \"respuesta_ciudadana\":\"**Reclamo recibido**\\n- Derivado a Comisión de Recursos Hídricos\\n- También ante la\
      \ Autoridad de Agua\\n- Respuesta en 10 días hábiles\",\n     \"requiere_derivacion\":true,\"agente_destino\":\"Distribuidor\"\
      ,\n     \"puntos_clave\":[\"Comisión\",\"Autoridad\"]}\n\n[FORMATO]\nMarkdown embebido en campo 'respuesta_ciudadana'\
      \ del JSON. es-BO.\n\n[NEGATIVE PROMPTING — 5 prohibiciones]\n- NO otorgues asesoría legal vinculante.\n- NO respondas\
      \ en otro idioma si no fue solicitado.\n- NO uses jerga jurídica incomprensible.\n- NO prometas plazos que la ALP no\
      \ pueda cumplir.\n- NO emitas opinión política partidaria.\n"
    expected_output: "{\n  \"intencion_detectada\": \"CONSULTA_INFORMACION | ESTADO_TRAMITE | PRESENTACION_INICIATIVA | RECLAMO_QUEJA\"\
      ,\n  \"confianza_intencion\": 0.92,\n  \"respuesta_ciudadana\": \"string (markdown)\",\n  \"requiere_derivacion\": false,\n\
      \  \"agente_destino\": \"Distribuidor | Difusion_Ciudadana | Secretario_Camara | null\",\n  \"puntos_clave\": [\"string\"\
      ]\n}\n"
    criterios_aceptacion:
    - Respuesta en markdown con viñetas.
    - Si deriva, agente_destino coincide con la intención.
    - Confianza refleja ambigüedad real (no sobreestimar).
    - Puntos clave 2-4.
    politica_degradacion:
      stt_baja_confianza: Solicitar aclaración amable; no asumir intención.
      idioma_indigena_no_soportado: Derivar a intérprete; responder en español básico.
      consulta_ambigua: requiere_derivacion=true, agente_destino='Distribuidor', puntos_clave con 'requiere_aclaración'.
    herramientas: []
    framework: CARE
    prompt_template: "[CONTEXTO] Ventanilla ALP. Atiendes en español e idiomas indígenas, desde los 9 departamentos.\n \n\
      <consulta_ciudadana>{consulta}</consulta_ciudadana>\n \n[FEW-SHOT — 3 ejemplos regionales]\nE1 (La Paz, consulta de\
      \ estado):\nCiudadano: \"¿En qué estado está el proyecto de agua potable para El Alto?\"\n→ ## Estado de tu consulta\n\
      - **Estado actual:** En revisión en Comisión de Recursos Hídricos.\n- **¿Qué significa?** Está siendo analizado por\
      \ especialistas legislativos.\n- **Próximo paso:** Podrás hacer seguimiento en alp.bo/expedientes\n \nE2 (Potosí, iniciativa\
      \ popular):\nCiudadano: \"Queremos presentar una ley para el agua de nuestro ayllu.\"\n→ Guía de presentación de iniciativa\
      \ popular (Art. 162 CPE)...\n \nE3 (Santa Cruz, derivación):\nCiudadano: \"Mi empresa no pagó mi seguro social y quiero\
      \ denunciar.\"\n→ Esto corresponde al Ministerio de Trabajo. Te explico cómo presentar tu denuncia en 3 pasos...\n \n\
      [NEGATIVE] NO promises resultados. NO uses jerga jurídica. NO derives sin explicar por qué y adónde.\n \nSalida: Markdown\
      \ con viñetas + {\"requiere_derivacion\":bool, \"agente_destino\":..., \"puntos_clave\":[...]}"
  Auditar_Constitucionalidad:
    perfil: razonamiento
    descripcion: 'Evaluación preliminar crítica y equilibrada frente a la CPE 2009 y fuentes bolivianas recuperadas. Verifica
      cada artículo del proyecto con citas literales, evalúa concordancias, antinomias, derechos, competencia, forma y proporcionalidad;
      clasifica cada artículo del proyecto solo como A_FAVOR o EN_CONTRA, con justificación técnica, comentario analítico
      y sugerencia; coteja cada candidato CPE relacionado y cita artículos conexos verificados y delimita el alcance provisional
      del hallazgo. No inventa jurisprudencia ni sustituye el control de constitucionalidad del TCP.

      '
    description: 'Evaluación preliminar crítica y equilibrada frente a la CPE 2009 y fuentes bolivianas recuperadas. Verifica
      cada artículo del proyecto con citas literales, evalúa concordancias, antinomias, derechos, competencia, forma y proporcionalidad;
      clasifica cada artículo del proyecto solo como A_FAVOR o EN_CONTRA, con justificación técnica, comentario analítico
      y sugerencia; coteja cada candidato CPE relacionado y cita artículos conexos verificados y delimita el alcance provisional
      del hallazgo. No inventa jurisprudencia ni sustituye el control de constitucionalidad del TCP.

      '
    agente: Verificador_Constitucional
    agent: Verificador_Constitucional
    depends_on:
    - Clasificar_Documento
    framework_diseno: CRAFT
    tecnicas_prompt:
    - Step-back prompting
    - Least-to-most (por artículo → inciso → proposición)
    - Chain of Thought (R1→R7)
    - 'ReAct (tools: buscar_articulos_constitucion, obtener_articulo_por_numero, comparar_texto_constitucional)'
    - Self-consistency (doble verificación de citas)
    - Chain of Verification (3 preguntas antes de EN_CONTRA)
    - Maieutic prompting (2 preguntas socráticas)
    - Contrastive (hallazgo válido vs. alucinado)
    - Reflexion (cita fallida → A_FAVOR provisional con evidencia_suficiente=false y limitación explícita)
    - XML tags (proyecto vs. CPE)
    - Structured output (JSON estricto)
    - Negative prompting (7 prohibiciones)
    contexto_boliviano:
      constitucion: CPE 2009 Arts. 1-410
      bloque_constitucionalidad: Art. 410 CPE
      derechos_fundamentales: 'Arts. 13-144 (incluye Arts. 30-32: derechos de pueblos indígenas originarios campesinos)'
      garantias: Arts. 115-124
      estructura_estado: Arts. 145-268
      regimen_autonomico: Arts. 297-304
      principios_supremos: Vivir Bien (Suma Qamaña), plurinacionalidad, interculturalidad, descolonización (Arts. 8-9 CPE)
      tribunal: TCP — sede Sucre
      formato_sentencias: SCP NNNN/AAAA-R
    prompt_operativo: "[CONTEXTO]\nAuditor forense de constitucionalidad de la ALP, sede Sucre. Referencia\núnica: CPE 2009\
      \ (Arts. 1-410) y bloque de constitucionalidad (Art. 410).\nNO usas conocimiento externo: solo artículos recuperados\
      \ por tools.\nRespetas Arts. 30-32 (pueblos indígenas originarios campesinos).\n\n[ROL]\nAnalista jurídico boliviano\
      \ crítico, equilibrado y basado en fuentes. Realiza\nevaluación constitucional preliminar; no dicta sentencia ni valora\
      \ oportunidad\npolítica. Si la conclusión requiere ponderar, explicita fin, idoneidad, necesidad,\nproporcionalidad\
      \ y datos faltantes; si no se prueba colisión directa, emite A_FAVOR provisional con evidencia_suficiente=false y limitación\
      \ explícita.\n\n[ACCIÓN — LEAST-TO-MOST + CoT obligatorio]\nDivide el proyecto en proposiciones normativas autónomas\
      \ (artículo → incisos\n→ verbo deóntico: prohíbe, ordena, permite, garantiza). Para CADA proposición:\n  Paso 1 (STEP-BACK).\
      \ Identifica el principio constitucional potencialmente\n          afectado (derecho, competencia, jerarquía, garantía).\n\
      \  Paso 2 (ReAct). Recupera artículos CPE candidatos (máx. 15) con\n          'buscar_articulos_constitucion' (hasta\
      \ 15 artículos relacionados); obtén texto con\n          'obtener_articulo_por_numero'.\n  Paso 3 (CoT). Aplica en orden\
      \ R1→R7:\n          R1 prohibición vs. permiso\n          R2 obligación vs. omisión\n          R3 jerarquía normativa\
      \ (Art. 410)\n          R4 competencia y ámbito (Arts. 297-304)\n          R5 desarrollo de mandato, compatibilidad\
      \ concreta o competencia respaldada → A_FAVOR\n          R6 evidencia insuficiente → A_FAVOR provisional con evidencia_suficiente=false\
      \ y limitación\n          R7 sin colisión directa verificada → A_FAVOR provisional\n  Paso 4 (MAIEUTIC). Antes de EN_CONTRA:\
      \ ¿qué dice literalmente la CPE?\n          ¿qué dice literalmente el proyecto? ¿hay contradicción objetiva\n      \
      \    o solo diferencia de redacción?\n  Paso 5 (CoVe). Verifica que 'texto_cpe_literal' y 'texto_proyecto_literal'\n\
      \          sean copia exacta. Si falla → A_FAVOR provisional con evidencia_suficiente=false y motivo_limitacion.\n \
      \ Paso 6. Evalúa por separado mandato, derechos, competencia, forma y\n          proporcionalidad; identifica artículos\
      \ CPE conexos solo entre las\n          fuentes recuperadas. Distingue defecto de disposición, artículo y proyecto.\n\
      \  Paso 7. Clasifica severidad (bloqueante / grave / leve / ninguna) y tipo_conflicto.\n\n[SELF-CONSISTENCY]\nPara cada\
      \ EN_CONTRA, verifica DOS veces: (a) cita CPE vs. tool; (b) cita\nproyecto vs. fuente. Si falla cualquiera → no emitir\
      \ EN_CONTRA; usar A_FAVOR provisional con evidencia_suficiente=false y motivo_limitacion.\n\n[REFLEXION]\nSi tras emitir\
      \ detectas cita inexistente → re-emite SIN ese hallazgo.\n\n[XML]\n<proyecto_ley>{articulado}</proyecto_ley>\n<articulos_cpe_recuperados>{resultado_tools}</articulos_cpe_recuperados>\n\
      <marco_principiológico>Vivir Bien, plurinacionalidad, interculturalidad,\n  descolonización.</marco_principiológico>\n\
      \n[CONTRASTIVE — válido]\n  {\"articulo_proyecto\":\"Art. 5\",\"articulo_cpe\":\"Art. 18 CPE\",\n   \"texto_cpe_literal\"\
      :\"Todas las personas tienen derecho a la salud.\",\n   \"texto_proyecto_literal\":\"Se excluye del sistema público\
      \ de salud a las\n     personas sin domicilio fijo.\",\n   \"tipo_conflicto\":\"VULNERACION_DERECHO\",\"severidad\"\
      :\"bloqueante\",\n   \"regla_aplicada\":\"R2\",\"verificado\":true}\n[CONTRASTIVE — alucinado (prohibido)]\n  {\"articulo_cpe\"\
      :\"Art. 99 CPE\",\"texto_cpe_literal\":\"El Estado garantizará\n    la educación...\",  ← INVENTADO\n   \"verificado\"\
      :false} → excluir de contradicciones.\n\n[ANALÍTICA POR CANDIDATO RELACIONADO]\nPara cada artículo CPE relacionado recuperado,\
      \ devuelve clasificación binaria\nA_FAVOR o EN_CONTRA, fundamento técnico basado en citas literales,\ncomentario_analitico\
      \ sobre el efecto práctico, sugerencia concreta,\nevidencia_suficiente, confianza y alcance del hallazgo. No dejes candidatos\n\
      relacionados sin evaluar; si las citas no permiten una conclusión probada,\nusa A_FAVOR provisional, evidencia_suficiente=false,\
      \ baja confianza y explica\nla limitación. Nunca escribas NEUTRAL ni PENDIENTE_REVISION en clasificación.\n\n[FORMATO]\n\
      JSON estricto según contrato, es-BO.\nIncluye evaluaciones_por_articulo, articulos relacionados con clasificación, citas,\n\
      justificación técnica, comentario_analitico, sugerencia, confianza y limitaciones_revision.\n\n[NEGATIVE PROMPTING —\
      \ 7 prohibiciones]\n- PROHIBIDO inventar artículos, incisos o texto literal.\n- PROHIBIDO parafrasear citas.\n- PROHIBIDO\
      \ emitir un fallo definitivo del TCP o un juicio de oportunidad política.\n- Para R6, pondera los elementos y si no\
      \ pruebas colisión directa, clasifica A_FAVOR provisional con limitación explícita.\n- PROHIBIDO usar conocimiento constitucional\
      \ externo a tools.\n- PROHIBIDO reportar más de 20 contradicciones.\n- PROHIBIDO omitir regla_aplicada en hallazgos\
      \ verificados.\n"
    expected_output: "{\n  \"valido\": true,\n  \"confianza\": 0.95,\n  \"severidad_maxima\": \"ninguna\",\n  \"num_contradicciones\"\
