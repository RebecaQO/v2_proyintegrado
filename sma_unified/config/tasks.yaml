tarea_clasificacion_comision:
  description: 'Analizar técnica y jurídicamente la iniciativa de ley para determinar con precisión vinculante la Comisión
    Principal (matriz encargada del dictamen de fondo) y la Comisión Coadyuvante (secundaria encargada del análisis concurrente,
    presupuestario o constitucional), valorando el núcleo material del proyecto, el impacto fiscal sobre el TGN y las competencias
    territoriales o sectoriales, conforme al Art. 156 de la CPE y al Reglamento General Camaral de la ALP.

    '
  agent: Presidencia_Comision
  framework_diseno: CARE
  tecnicas_prompt:
  - Role prompting (Clasificador Oficial de Comisiones ALP)
  - Chain of Thought (evaluación de competencias en 4 pasos)
  - Regla de Dos Comisiones (Comisión Principal + Comisión Coadyuvante)
  - Few-shot canónico (ejemplo con justificación jurídica)
  - Structured output (JSON estricto es-BO)
  - Negative prompting (5 restricciones terminantes)
  contexto_boliviano:
    marco_normativo:
    - Constitución Política del Estado 2009 (Art. 156)
    - Reglamento General de la Cámara de Diputados y de Senadores (Arts. 115 a 125)
    - Ley 1178 de Administración y Control Gubernamentales (SAFCO)
    regla_distribucion_dos_comisiones: "1. Todo proyecto tiene una y solo una Comisión Principal según el objeto sustantivo\
      \ de la ley. 2. Si el proyecto involucra gasto, créditos, deuda o recursos del TGN -> Se asigna obligatoriamente\n \
      \  como Comisión Coadyuvante a la Comisión de Planificación, Política Económica y Finanzas.\n3. Si el proyecto modifica\
      \ códigos sustantivos, procesales, normas penales o estructura de órganos del Estado\n   -> Se asigna como Comisión\
      \ Coadyuvante a la Comisión de Constitución, Legislación y Sistema Electoral.\n4. Si involucra régimen autonómico o\
      \ límites -> Comisión de Organización Territorial y Autonomías.\n"
  prompt_operativo: "[ROL Y MISIÓN PARLAMENTARIA]\nActúa como la Máxima Autoridad Técnica de Clasificación y Asignación de\
    \ Comisiones de la Asamblea\nLegislativa Plurinacional de Bolivia (ALP). Tu deber es examinar el proyecto de ley y determinar\
    \ sin ambigüedad\nlas comisiones parlamentarias encargadas de su sustanciación legislativa.\n\n[TEXTO DEL PROYECTO DE\
    \ LEY EVALUADO]\n<proyecto_ley>\n{texto_documento}\n</proyecto_ley>\n\n[CATÁLOGO OFICIAL DE COMISIONES ACTIVAS EN LA BASE\
    \ DE DATOS]\n<comisiones_disponibles>\n{comisiones_info}\n</comisiones_disponibles>\n\n[MÉTODO DE EVALUACIÓN JURÍDICA\
    \ — 4 PASOS OBLIGATORIOS]\n  Paso 1. Identifica el NÚCLEO MATERIAL Y OBJETO SUSTANTIVO: ¿Qué relación jurídica o sector\
    \ regula?\n          Selecciona exactamente una COMISIÓN PRINCIPAL del catálogo de comisiones activas.\n  Paso 2. Identifica\
    \ IMPACTOS CONCURRENTES (Regla de Dos Comisiones):\n          - Si compromete fondos públicos, partidas del TGN, exenciones\
    \ o gasto público → Asigna como COMISIÓN COADYUVANTE a 'Comisión de Planificación, Política Económica y Finanzas'.\n \
    \         - Si altera normas penales, códigos procesales o garantías constitucionales → Asigna como COMISIÓN COADYUVANTE\
    \ a 'Comisión de Constitución, Legislación y Sistema Electoral'.\n          - Si no existe conexidad material secundaria\
    \ → Asigna 'NINGUNA' o la comisión sectorial afín.\n  Paso 3. Califica la COMPLEJIDAD (Baja, Media, Alta), la PRIORIDAD\
    \ (Normal, Alta, Urgente) y el PLAZO REGLAMENTARIO (15 a 30 días hábiles).\n  Paso 4. Extrae de 4 a 6 PALABRAS CLAVE sustantivas\
    \ y redacta un RESUMEN EJECUTIVO (2 a 4 líneas) junto con la FUNDAMENTACIÓN DE COMPETENCIA.\n\n[CONTRATO DE SALIDA — JSON\
    \ ESTRICTO]\nDevuelve ÚNICAMENTE un objeto JSON con este esquema exacto, sin bloques de código markdown ni texto adicional:\n\
    {\n  \"comision_principal\": \"Nombre exacto de la comisión principal seleccionada\",\n  \"comision_coadyuvante\": \"\
    Nombre exacto de la comisión coadyuvante o NINGUNA\",\n  \"fundamentacion_competencia\": \"Explicación jurídica de 30-70\
    \ palabras justificando por qué ambas comisiones son competentes según la CPE y el Reglamento Camaral\",\n  \"palabras_clave\"\
    : [\"Palabra1\", \"Palabra2\", \"Palabra3\", \"Palabra4\"],\n  \"resumen\": \"Resumen técnico formal de 2-4 oraciones\
    \ sobre el alcance de la propuesta\",\n  \"complejidad\": \"Baja | Media | Alta\",\n  \"prioridad\": \"Normal | Alta |\
    \ Urgente\",\n  \"plazo_dias\": 20\n}\n\n[PROHIBICIONES ESTRICTAS]\n- NO asignes comisiones fuera del catálogo disponible\
    \ suministrado.\n- NO omitas la Comisión de Planificación y Finanzas si el proyecto dispone creación de entidades con\
    \ presupuesto público o partidas del TGN.\n- NO uses abreviaciones informales para los nombres de las comisiones.\n- NO\
    \ devuelvas texto introductorio ni explicaciones fuera del JSON.\n"
  expected_output: 'JSON estricto con: comision_principal, comision_coadyuvante, fundamentacion_competencia, palabras_clave,
    resumen, complejidad, prioridad y plazo_dias.

    '
  criterios_aceptacion:
  - Comisión Principal pertenece exactamente al catálogo de comisiones activas de la ALP.
  - Comisión Coadyuvante fundamentada correctamente ante impacto fiscal o constitucional.
  - Plazo en días hábiles entre 15 y 30 días reglamentarios.
  - Extracción válida de descriptores temáticos.
  politica_degradacion:
    comision_no_encontrada: Asignar por defecto COMISION_DE_CONSTITUCION como principal y COMISION_DE_PLANIFICACION_Y_FINANZAS
      como coadyuvante.
  framework: CARE
  prompt_template: "[ROL Y MISIÓN PARLAMENTARIA]\nActúa como la Máxima Autoridad Técnica de Clasificación y Asignación de\
    \ Comisiones de la ALP.\n \n<proyecto_ley>{texto_documento}</proyecto_ley>\n<comisiones_disponibles>{comisiones_info}</comisiones_disponibles>\n\
    \ \n[MÉTODO DE EVALUACIÓN JURÍDICA — 4 PASOS OBLIGATORIOS]\nPaso 1. NÚCLEO MATERIAL Y OBJETO SUSTANTIVO → COMISIÓN PRINCIPAL.\n\
    Paso 2. IMPACTOS CONCURRENTES (Regla de Dos Comisiones) → COADYUVANTE.\nPaso 3. Complejidad, Prioridad y Plazo (15-30\
    \ días hábiles).\nPaso 4. 4-6 palabras clave + resumen ejecutivo + fundamentación.\n \n[CONTRATO DE SALIDA — JSON ESTRICTO]\n\
    { \"comision_principal\": ..., \"comision_coadyuvante\": ...,\n  \"fundamentacion_competencia\": ..., \"palabras_clave\"\
    : [...],\n  \"resumen\": ..., \"complejidad\": ..., \"prioridad\": ...,\n  \"plazo_dias\": ... }\n \n[PROHIBICIONES ESTRICTAS]\n\
    - NO asignes comisiones fuera del catálogo.\n- NO omitas Planificación y Finanzas si hay gasto o TGN.\n- NO uses abreviaciones\
    \ informales.\n- NO devuelvas texto introductorio fuera del JSON."
