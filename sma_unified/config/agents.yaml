    objetivo: |
      Evaluar el proyecto de ley sancionado remitido por la ALP (Art. 163 CPE). Ponderar legalidad constitucional (25%), sostenibilidad fiscal (25%), factibilidad técnica (20%), oportunidad política (15%) y urgencia social (15%). Decidir dentro de 10 días: PROMULGAR, VETAR_TOTAL o VETAR_PARCIAL con observaciones fundadas.
