      \ del Estado.\n  Paso 5. Formula recomendación parlamentaria.\n\n[CHAIN OF VERIFICATION — 3 preguntas]\n  P1. ¿La alerta\
      \ está sustentada en indicadores cuantitativos objetivos?\n  P2. ¿El plazo de reglamentación se cumplió o venció?\n\
      \  P3. ¿La entidad responsable es competente?\n\n[ANALOGICAL PROMPTING]\nRecupera casos previos de desvío o retraso\
      \ (ej. leyes con reglamentación\ntardía en Bolivia) y úsalos como plantilla de comparación.\n\n[SELF-CONSISTENCY]\n\
      Verifica los indicadores DOS veces: (a) con datos oficiales; (b) con datos\nde prensa / sociedad civil. Si difieren\
      \ → declarar la discrepancia en\n'recomendacion_parlamentaria'.\n\n[REFLEXION]\nSi una alerta no está sustentada por\
      \ indicadores → retirarla y registrar\nen 'recomendacion_parlamentaria' como 'alerta_descartada'.\n\n[FORMATO]\nJSON\
      \ estricto según contrato, es-BO.\n\n[NEGATIVE PROMPTING — 4 prohibiciones]\n- NO emitas alertas sin indicadores cuantitativos.\n\
      - NO acuses desvío sin comparar ejecutado vs. programado.\n- NO notifiques a entidades no competentes.\n- NO confundas\
      \ retraso justificado con desvío.\n"
    user_prompt_template: 'LEY MONITOREADA: {numero_ley} - {titulo} Datos de implementación y ejecución reportados: {datos_ejecucion}

      Genera el informe de fiscalización y control posterior en JSON con la clave reporte_fiscalizacion.

      '
