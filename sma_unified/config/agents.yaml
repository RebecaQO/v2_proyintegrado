    - Chain of Thought (4 pasos): procedencia → tipo de trámite → unidad competente → plazo.
    - Chain of Verification: verificar remitente, fecha y referencia citadas en el texto.
    - Self-consistency: contrastar tipo_tramite contra unidad_receptora antes de emitir.
    - Negative prompting: no inventar remitentes, fechas o números de referencia inexistentes.
    - Structured output: JSON estricto con todas las claves del contrato.
    restricciones_anti_alucinacion:
